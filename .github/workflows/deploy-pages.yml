name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require master
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::GitHub Pages can only be deployed from master."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: validate-ref
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build for Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Task 17: the per-chunk size budget is a release gate, not a local
      # convenience. Running it here — against the same Pages build that is
      # about to be uploaded — means a Base/A1/A2 catalogue that grows past
      # the 500 KiB per-chunk ceiling fails the deploy instead of silently
      # shipping a chunk no browser can cache independently.
      - name: Check bundle budget
        run: npm run check:bundle

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
